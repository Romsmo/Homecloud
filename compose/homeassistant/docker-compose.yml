# Home Assistant
# Hinweis: das Image liegt unter Docker Hub (homeassistant/home-assistant),
# NICHT unter ghcr.io/home-assistant/home-assistant - letzteres lieferte in
# der Praxis "error from registry: denied".

services:
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TZ: Europe/Berlin
    volumes:
      - ha_config:/config

volumes:
  ha_config:
