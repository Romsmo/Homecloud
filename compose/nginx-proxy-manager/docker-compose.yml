# Nginx Proxy Manager (NPM)
# Primaerer Reverse Proxy dieses Tutorials (siehe docs/06-reverse-proxy-https.md) - so war es
# auch im in der Seminararbeit gemessenen Testsystem konfiguriert. Nur sinnvoll, wenn der Host
# noch KEINEN anderen Webserver auf Port 80/443 betreibt; bei einem Portkonflikt ("address already
# in use") siehe die Apache-Alternative in Kapitel 6.

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"     # Admin-Weboberflaeche
      - "443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  npm_data:
  npm_letsencrypt:
