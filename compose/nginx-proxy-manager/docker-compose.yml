# Nginx Proxy Manager (NPM)
# Optionale, Docker-basierte ALTERNATIVE zum primaeren, nativen Apache-Reverse-Proxy
# (siehe docs/06-reverse-proxy-https.md) - NICHT die im Seminararbeit-Testsystem gemessene
# Konfiguration (dort kam nativer Apache + Certbot zum Einsatz). Nur sinnvoll, wenn der Host
# noch KEINEN anderen Webserver auf Port 80/443 betreibt; bei einem Portkonflikt ("address already
# in use") stattdessen den nativen Apache-Weg aus Kapitel 6 nutzen.

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"     # Admin-Weboberflaeche
      - "443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  npm_data:
  npm_letsencrypt:
