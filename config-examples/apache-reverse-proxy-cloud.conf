# /etc/apache2/sites-available/cloud.example.com.conf
# Nativer Apache auf demselben Host wie der Nextcloud-Docker-Container.
# Ersetze cloud.example.com durch deine eigene Subdomain.

<VirtualHost *:80>
    ServerName cloud.example.com

    # Härtung: Apache-Version/-Signatur nicht im Response-Header/Error-Seiten ausgeben.
    # Hinweis aus der Arbeit: Der "Server: Apache/2.4.x"-Header blieb trotz dieser beiden
    # Direktiven (gesetzt in der globalen security.conf) sowohl vor als auch nach der Haertung
    # sichtbar - plane das als bekannte Einschraenkung ein, nicht als garantiert geloest.
    ServerTokens Prod
    ServerSignature Off

    # Certbot benoetigt initial HTTP fuer die Domain-Validierung.
    # Nach dem ersten "certbot --apache -d cloud.example.com" ergaenzt
    # Certbot automatisch einen Redirect auf HTTPS sowie einen zweiten
    # VirtualHost-Block fuer Port 443 (siehe unten, Beispiel nach Certbot-Lauf).

    ProxyPreserveHost On
    # Nextcloud laeuft als Docker-Container auf demselben Host, nur lokal gebunden.
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>

# Nach "sudo certbot --apache -d cloud.example.com" generiert/erweitert Certbot
# automatisch einen Block aehnlich diesem (nur zur Referenz, nicht manuell noetig):
#
# <VirtualHost *:443>
#     ServerName cloud.example.com
#
#     ServerTokens Prod
#     ServerSignature Off
#
#     ProxyPreserveHost On
#     ProxyPass / http://127.0.0.1:8080/
#     ProxyPassReverse / http://127.0.0.1:8080/
#
#     # Sicherheitsrelevante HTTP-Header (siehe Kapitel 8, Massnahme 7)
#     Header always set X-Content-Type-Options "nosniff"
#     Header always set X-Frame-Options "SAMEORIGIN"
#     Header always set Referrer-Policy "no-referrer"
#     Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"
#
#     SSLCertificateFile /etc/letsencrypt/live/cloud.example.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/cloud.example.com/privkey.pem
#     Include /etc/letsencrypt/options-ssl-apache.conf
# </VirtualHost>
