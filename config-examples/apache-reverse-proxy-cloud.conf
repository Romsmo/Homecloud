# /etc/apache2/sites-available/cloud.example.com.conf
# Auf Server A (bestehender Apache-Server). Ersetze cloud.example.com und die LAN-IP.

<VirtualHost *:80>
    ServerName cloud.example.com

    # Certbot benoetigt initial HTTP fuer die Domain-Validierung.
    # Nach dem ersten "certbot --apache -d cloud.example.com" ergaenzt
    # Certbot automatisch einen Redirect auf HTTPS sowie einen zweiten
    # VirtualHost-Block fuer Port 443 (siehe unten, Beispiel nach Certbot-Lauf).

    ProxyPreserveHost On
    ProxyPass / http://192.168.1.20:8080/
    ProxyPassReverse / http://192.168.1.20:8080/
</VirtualHost>

# Nach "sudo certbot --apache -d cloud.example.com" generiert/erweitert Certbot
# automatisch einen Block aehnlich diesem (nur zur Referenz, nicht manuell noetig):
#
# <VirtualHost *:443>
#     ServerName cloud.example.com
#
#     ProxyPreserveHost On
#     ProxyPass / http://192.168.1.20:8080/
#     ProxyPassReverse / http://192.168.1.20:8080/
#
#     SSLCertificateFile /etc/letsencrypt/live/cloud.example.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/cloud.example.com/privkey.pem
#     Include /etc/letsencrypt/options-ssl-apache.conf
# </VirtualHost>
